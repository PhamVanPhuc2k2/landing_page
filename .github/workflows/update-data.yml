name: Cập nhật bài viết từ Dân Việt

on:
  schedule:
    - cron: "17 * * * *" # mỗi giờ (phút 17, giờ UTC)
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy bài mới từ các chủ đề
        run: python3 scripts/update_data.py

      - name: Commit nếu dữ liệu thay đổi
        run: |
          if git diff --quiet -- js/data.js data/article-cache.json; then
            echo "Không có thay đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js data/article-cache.json
          git commit -m "Cập nhật bài viết từ Dân Việt"
          git push
